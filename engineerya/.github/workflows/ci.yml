name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: engineerya

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: engineerya/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate materials metadata
        run: node scripts/generate-materials.mjs

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Type Check
        run: npm run typecheck --workspace=apps/web

      - name: Build web
        env:
          GITHUB_ACTIONS: "false"
        run: npm run build --workspace=apps/web
